<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthSync - Profile</title>

<link rel="stylesheet" href="../cssFiles/main.css">
<link rel="stylesheet" href="../cssFiles/userProfile.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>

<!-- NAV -->
<nav class="top-nav">
    
    <div class="nav-left">
        <img src="../assets/images/sync.png" class="logo-icon">
        <span class="logo-text">Health<span>Sync</span></span>
    </div>

    <div class="nav-center">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="features.html">Features</a>
        <a href="benefits.html">Benefits</a>
        <a href="profile.html" class="active">Profile</a>
    </div>

    <div class="nav-right">
        <img src="../assets/images/Userprofileicon.avif" class="user-icon">
    </div>

</nav>

<div class="page-wrapper">

<!-- SIDEBAR -->
<aside class="sidebar">
    <nav>
        <a href="profile.html" class="active">👤 Profile</a>
        <a href="workout.html">⚡ Workout</a>
        <a href="nutrition.html">🥗 Nutrition</a>
        <a href="mealplan.html">📋 Meal Plan</a>
        <a href="progress.html">📈 Progress</a>
    </nav>

    <div class="logout">
        <a href="#" onclick="handleLogout()">🚪 Logout</a>
    </div>
</aside>

<!-- MAIN -->
<main class="main-content">

<div class="profile-header">
    <div class="avatar" id="avatarDisplay">?</div>
    <div>
        <h2 id="displayName">User</h2>
        <p id="displayUsername">@username</p>
    </div>
</div>

<div class="stats-row">

    <div class="stat-card">
        <p>Daily Calories</p>
        <h2 id="statCalories">—</h2>
    </div>

    <div class="stat-card">
        <p>BMI</p>
        <h2 id="statBMI">—</h2>
    </div>

    <div class="stat-card">
        <p>Activity</p>
        <h2 id="statActivity">—</h2>
    </div>

    <div class="stat-card">
        <p>Goals</p>
        <h2 id="statGoals">—</h2>
    </div>

</div>

<div class="card">
    <h3>Calorie Overview</h3>
    <canvas id="calorieChart"></canvas>
</div>

</main>

<!-- RIGHT PANEL -->
<aside class="right-panel">

<div class="card">
    <h4>Information</h4>
    <p>Age: <span id="infoAge">—</span></p>
    <p>Height: <span id="infoHeight">—</span></p>
    <p>Weight: <span id="infoWeight">—</span></p>
</div>

<div class="card donut-card">
    <h4>Workouts</h4>

    <div class="donut-wrapper">
        <canvas id="donutChart"></canvas>
        <div class="donut-center">
              9/21
         <div class="donut-label">Workouts</div>
        </div>
    </div>

</div>

</aside>

</div>

<script>

// DATA LOAD
const user = JSON.parse(localStorage.getItem('user') || '{}');
const metrics = user.metrics || {};
const health = user.health || {};

// POPULATE
document.getElementById('displayName').textContent =
    user.firstName || "User";

document.getElementById('displayUsername').textContent =
    '@' + (user.username || 'user');

document.getElementById('avatarDisplay').textContent =
    (user.firstName?.[0] || '?');

document.getElementById('statGoals').textContent =
    user.goals?.length || '—';

document.getElementById('statActivity').textContent =
    metrics.activity || '—';

 document.getElementById('statCalories').textContent =
health.recommendedCalories ? Math.round(health.recommendedCalories) : "—";

document.getElementById('statBMI').textContent =
    health.bmi || "—";

document.getElementById('infoAge').textContent =
    metrics.age || '—';

document.getElementById('infoHeight').textContent =
    metrics.heightFt || '—';

document.getElementById('infoWeight').textContent =
    metrics.weight || '—';

// CHARTS
new Chart(document.getElementById('calorieChart'), {
    type: 'line',
    data: {
        labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        datasets: [{
            label: "Calories",
            data: [1800,2100,2000,2300,2100,1900,2200],
            borderColor: '#CCFF00',
            backgroundColor: 'rgba(204,255,0,0.1)',
            fill: true,
            tension: 0.4
        }]
    },
   options: {
    responsive: true,
    plugins: {
        legend: { display: false }
    },
    scales: {
        x: {
            ticks: { color: "#888" },
            grid: { display: false }
        },
        y: {
            ticks: { color: "#666" },
            grid: { color: "#1a1a1a" }
        }
    }
}
});

// DOUGHNUT 

new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: {
        datasets: [{
            data: [9, 12],
            backgroundColor: ['#CCFF00', '#1e1e1e'],
            borderWidth: 2
        }]
    },
         options: {
    cutout: '70%',
    animation: {
        animateRotate: true,
        duration: 1200
    },
    plugins: {
        legend: { display: false }
    }
    }
});

// LOGOUT
function handleLogout() {
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

</script>

</body>
</html>
